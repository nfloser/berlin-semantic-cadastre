name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore BerlinCadastre.slnx
      - name: Format check
        run: dotnet format BerlinCadastre.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build BerlinCadastre.slnx -c Release --no-restore
      - name: Deterministic tests
        run: dotnet test BerlinCadastre.slnx -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build container
        run: docker build -f docker/Dockerfile -t berlin-semantic-cadastre:ci .
